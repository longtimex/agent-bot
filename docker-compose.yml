services:
  agent-bot:
    build: .
    image: agent-bot:latest
    container_name: agent-bot
    restart: unless-stopped
    # 用独立 init 进程回收 Agent CLI 子进程，避免僵尸进程
    init: true
    ports:
      # 安卓 App 的 HTTP API。保持 127.0.0.1 前缀则只有本机/隧道可访问；
      # 想让局域网设备直连改成 "3080:3080"，公网 exposure 建议挂反向代理 + HTTPS
      - "127.0.0.1:3080:3080"
    environment:
      # 端口发布要求容器内监听 0.0.0.0（外部可达性由 ports 决定，不等于对公网开放）
      API_BIND: 0.0.0.0
      # 手机该连的地址（宿主机 IP:端口 或反向代理域名）。写在 .env 里即可，
      # /api 只有在拿到它时才会附带可扫的配对二维码：
      # API_PUBLIC_URL: http://192.168.1.10:3080
    volumes:
      # 容器启动前必须先准备好 .env（cp .env.example .env），否则 Docker 会在宿主机上建一个同名
      # 空目录挂进来，Bot 启动时会直接指出「.env 是一个目录」；缺配置同样会直接退出
      - ./.env:/app/.env:ro
      - ./data:/app/data
      # /cc model add 等会写 opencode.json；想跨镜像重建保留就解开注释
      # （前提：宿主机项目根目录已存在该文件，否则 Docker 会创建同名目录）
      # - ./opencode.json:/app/opencode.json
      # 容器镜像不包含 .git，也没有 systemd：/update 的隔离 release 构建与
      # apply-release.sh 不适用于容器。更新方式是在宿主机拉取代码后
      # `docker compose up -d --build`，以新镜像重启。
