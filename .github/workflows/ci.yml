name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            full: true
          - node: 20
            full: false
          - node: 24
            full: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # The full gate (60+ test suites) runs once; the other Node versions only prove that
      # the code still typechecks and builds there. Running everything three times made the
      # matrix the slowest job without covering any additional code.
      - name: Full checks
        if: matrix.full == true
        # The job log needs admin rights to download, but annotations are readable. Emit the
        # failing test names and compiler messages as annotations so a red run is diagnosable
        # from the API instead of only from the web UI.
        run: |
          set +e
          npm run check 2>&1 | tee /tmp/check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -aE "^not ok |^e: |error TS[0-9]+|budget|disagree|MISS " /tmp/check.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: Typecheck and build
        if: matrix.full != true
        run: npm run typecheck && npm run typecheck:tests && npm run build

  # `check:android` only balances braces and greps rules; it cannot see an unresolved
  # reference or a Compose scope error. Compiling here means a Kotlin change that never
  # built fails on the pull request instead of on a release tag.
  android:
    name: android assembleDebug
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Compile debug APK
        working-directory: android
        # Kotlin errors only exist in the job log, which needs admin rights to download.
        # Annotations are readable without it.
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -aE "^e: |error: |what went wrong" /tmp/gradle.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

  docker:
    name: docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # 构建即验证:Dockerfile、.dockerignore 与入口脚本的破坏(如 COPY 掉进
      # .dockerignore)在这里暴露,不需要推送镜像
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
