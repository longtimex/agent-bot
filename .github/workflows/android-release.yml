name: Publish Android APK

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The project has no checked-in gradlew and all published APKs use the
      # debug key, so release tags build the same installable debug artifact.
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/release/agent-bot.apk"
          (cd "$RUNNER_TEMP/release" && sha256sum agent-bot.apk > agent-bot.apk.sha256)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#android-v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$RUNNER_TEMP/release/agent-bot.apk#agent-bot.apk" \
              "$RUNNER_TEMP/release/agent-bot.apk.sha256#agent-bot.apk.sha256" \
              --clobber
          else
            gh release create "$tag" \
              "$RUNNER_TEMP/release/agent-bot.apk#agent-bot.apk" \
              "$RUNNER_TEMP/release/agent-bot.apk.sha256#agent-bot.apk.sha256" \
              --verify-tag \
              --title "Agent Bot Android v${version}" \
              --notes "Agent Bot Android v${version}. Download agent-bot.apk and verify it against agent-bot.apk.sha256."
          fi
